<style>
  /* ==========================================================================
     DESIGN TOKENS
     Rebuilt to match the "Approval Dashboard" reference layout: light neutral
     canvas, white elevated cards, a single strong blue accent, and
     status/category colors used consistently across the sidebar list,
     detail header, and pills.
  ========================================================================== */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --border: #e6e7eb;
    --border-strong: #d7d9df;

    --text-primary: #14161a;
    --text-secondary: #6b7079;
    --text-tertiary: #9a9ea6;

    --accent: #2f5cf0;
    --accent-dark: #2447c4;
    --accent-soft: rgba(47, 92, 240, 0.09);
    --accent-soft-strong: rgba(47, 92, 240, 0.16);

    --green: #16a34a;
    --green-soft: rgba(22, 163, 74, 0.1);
    --red: #e0393e;
    --red-soft: rgba(224, 57, 62, 0.1);
    --amber: #d97706;
    --amber-soft: rgba(217, 119, 6, 0.12);
    --info: #2563eb;
    --info-soft: rgba(37, 99, 235, 0.1);

    --hover: rgba(20, 22, 26, 0.04);
    --shadow-sm: 0 1px 2px rgba(16, 16, 20, 0.04);
    --shadow-md: 0 2px 10px rgba(16, 16, 20, 0.05);
    --shadow-lg: 0 16px 36px rgba(16, 16, 20, 0.14);

    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;

    --sidebar-w: 400px;
    --right-col-w: 296px;
    --gap: 14px;

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Category (AppSource) colors — used for the small square badges on
     sidebar cards and the large circular badge on the detail header. */
  .cat-osr   { background: #dbeafe; color: #2563eb; }
  .cat-xc    { background: #ede9fe; color: #7c3aed; }
  .cat-jo    { background: #d1fae5; color: #059669; }
  .cat-ar    { background: #e0e7ff; color: #4f46e5; }
  .cat-prf   { background: #fce7f3; color: #db2777; }
  .cat-leave { background: #fee2e2; color: #dc2626; }
  .cat-traf  { background: #fef3c7; color: #b45309; }
  .cat-obot  { background: #cffafe; color: #0891b2; }
  .cat-default { background: #f0f1f3; color: #6b7079; }

  /* ==========================================================================
     BASE
  ========================================================================== */
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body { background: var(--bg); }

  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  .surface-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  /* ==========================================================================
     AUTH GATE
  ========================================================================== */
  .auth-gate {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
  }
  .auth-card {
    padding: 38px 42px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    min-width: 300px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  .auth-spinner {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2.5px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .auth-status-text { margin: 0; font-size: 14.5px; color: var(--text-secondary); text-align: center; line-height: 1.5; }
  .auth-status-text.error { color: var(--red); font-weight: 650; }
  .auth-status-text.muted { color: var(--text-tertiary); }
  .auth-signin-wrap { margin-top: 4px; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .auth-retry-btn {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 26px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 700;
    width: 100%; transition: filter 0.15s var(--ease);
  }
  .auth-retry-btn:hover { filter: brightness(1.08); }
  .auth-alt-wrap { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .auth-alt-label { margin: 0; font-size: 12px; color: var(--text-tertiary); text-align: center; }

  /* ==========================================================================
     APP SHELL / PAGE LAYOUT
  ========================================================================== */
  .app-shell {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    padding: 14px;
    gap: var(--gap);
    opacity: 0;
    animation: fadeIn 0.3s var(--ease) forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* ---- Top header bar ---- */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 18px;
    justify-content: space-between;
    padding: 10px 18px;
  }

  .topbar-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-icon {
    width: 34px; height: 34px; border-radius: 9px;
    //background: linear-gradient(135deg, #3358f4, #7c3aed);
    display: flex; align-items: center; justify-content: center; color: #fff;
    flex-shrink: 0;
  }
  .brand-icon svg { width: 18px; height: 18px; }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-title { font-size: 16.5px; font-weight: 750; letter-spacing: -0.01em; color: var(--text-primary); }
  .brand-subtitle { font-size: 11.5px; color: var(--text-tertiary); font-weight: 550; }

  .topbar-search {
    flex: 1;
    display: flex; align-items: center; gap: 9px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    max-width: 560px;
    margin: 0 auto;
    transition: border-color 0.15s var(--ease);
  }
  .topbar-search:focus-within { border-color: var(--accent); }
  .topbar-search svg { width: 15px; height: 15px; color: var(--text-tertiary); flex-shrink: 0; }
  .topbar-search input { border: none; background: transparent; outline: none; font-size: 13.5px; color: var(--text-primary); width: 100%; }
  .topbar-search input::placeholder { color: var(--text-tertiary); }
  .kbd-hint {
    flex-shrink: 0; font-size: 11px; font-weight: 650; color: var(--text-tertiary);
    background: var(--surface); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 6px; letter-spacing: 0.02em;
  }

  .topbar-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

  .icon-btn {
    position: relative;
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: transparent; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    transition: background 0.15s var(--ease), color 0.15s var(--ease);
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover { background: var(--hover); color: var(--text-primary); }
  .icon-btn.syncing svg { animation: spin 0.8s linear infinite; }
  
  .badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 15px; height: 15px; border-radius: 8px;
    background: var(--red); color: #fff; font-size: 10px; font-weight: 750;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
    border: 1.5px solid var(--surface);
  }

  .notif-wrap, .links-wrap, .profile-wrap { position: relative; }

  .popover {
    position: absolute; top: 42px; right: 0;
    width: 300px; max-height: 380px; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px; z-index: 60;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    animation: popIn 0.15s var(--ease-spring);
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .popover-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 8px; }
  .popover-title { font-size: 11px; font-weight: 750; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.05em; }
  .popover-clear-btn { border: none; background: transparent; color: var(--accent); font-size: 11.5px; font-weight: 700; padding: 4px 7px; border-radius: 6px; }
  .popover-clear-btn:hover { background: var(--accent-soft); }
  .popover-list { display: flex; flex-direction: column; gap: 2px; }
  .popover-item { padding: 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.12s var(--ease); }
  .popover-item:hover { background: var(--hover); }
  .popover-item-header { font-size: 12.5px; font-weight: 750; margin-bottom: 3px; }
  .popover-item-header.state-new { color: var(--accent); }
  .popover-item-header.state-approved { color: var(--green); }
  .popover-item-header.state-rejected { color: var(--red); }
  .popover-item-sub { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .popover-sub-text { font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .popover-sub-time { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
  .popover-empty, .popover-loading { padding: 16px 8px; font-size: 13px; color: var(--text-tertiary); text-align: center; }

  .links-popover .popover-list { gap: 3px; }
  .links-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 8px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; color: var(--text-secondary); text-decoration: none;
    transition: background 0.14s var(--ease), color 0.14s var(--ease);
  }
  .links-item svg { width: 14px; height: 14px; flex-shrink: 0; }
  .links-item:hover { background: var(--hover); color: var(--text-primary); }

  .profile-chip {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px;
    border: none; border-radius: 999px; background: transparent;
    transition: background 0.15s var(--ease); margin-left: 6px;
  }
  @media (hover: hover) {
    .profile-chip:hover { background: var(--hover); }
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 750; flex-shrink: 0;
  }
  .profile-meta { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .profile-name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); }
  .profile-role { font-size: 11px; color: var(--text-tertiary); font-weight: 550; }
  .chevron { width: 13px; height: 13px; color: var(--text-tertiary); transition: transform 0.15s var(--ease); }
  .profile-chip[aria-expanded="true"] .chevron { transform: rotate(180deg); }

  .profile-menu { width: 230px; padding: 6px; }
  .profile-menu-header { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
  .profile-menu-email { font-size: 12px; color: var(--text-tertiary); word-break: break-all; }
  .menu-item {
    width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px;
    border: none; background: transparent; border-radius: var(--radius-sm);
    font-size: 13.5px; font-weight: 650; color: var(--red);
    transition: background 0.12s var(--ease);
  }
  .menu-item svg { width: 15px; height: 15px; }
  .menu-item:hover { background: var(--red-soft); }

  /* ---- Body: left sidebar + (center / right) ---- */
  .app-body { flex: 1; display: flex; gap: var(--gap); min-height: 0; }

  .left-sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    display: flex; flex-direction: column; gap: 12px;
    padding: 16px 14px;
    overflow: hidden;
  }

  .sidebar-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 2px; }
  .sidebar-heading-left { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 750; color: var(--text-primary); }
  .sidebar-heading-left svg { width: 16px; height: 16px; color: var(--text-secondary); }
  .count-badge {
    font-size: 11.5px; font-weight: 750; color: var(--text-secondary);
    background: var(--bg); border: 1px solid var(--border);
    padding: 2px 9px; border-radius: 999px;
  }

  .filter-pills { display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; padding-bottom: 1px; }
  .filter-pills::-webkit-scrollbar { height: 0; }
  .pill {
    flex-shrink: 0; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: 12px; font-weight: 650; color: var(--text-secondary);
    transition: all 0.15s var(--ease); white-space: nowrap;
  }
  .pill:hover { background: var(--hover); }
  .pill.active { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }

  .sidebar-search {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 11px; flex-shrink: 0; transition: border-color 0.15s var(--ease);
  }
  .sidebar-search:focus-within { border-color: var(--accent); }
  .sidebar-search svg { width: 14px; height: 14px; color: var(--text-tertiary); flex-shrink: 0; }
  .sidebar-search input { border: none; background: transparent; outline: none; font-size: 13px; color: var(--text-primary); width: 100%; }
  .sidebar-search input::placeholder { color: var(--text-tertiary); }

  .request-stack { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; }
  .sidebar-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 13px; text-align: center; padding: 20px; }

  .req-card {
    padding: 12px 12px; border-radius: var(--radius-md);
    border: 1px solid transparent; border-left: 3px solid transparent;
    cursor: pointer; display: flex; gap: 10px;
    transition: background 0.14s var(--ease), border-color 0.14s var(--ease);
    animation: cardIn 0.22s var(--ease) backwards;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
  .req-card:hover { background: var(--hover); }
  .req-card.active { background: var(--accent-soft); border-color: var(--border); border-left-color: var(--accent); }

    /* ---- Sidebar loading skeleton ---- */
  .skeleton-card {
    padding: 12px; border-radius: var(--radius-md);
    border: 1px solid transparent; border-left: 3px solid transparent;
    display: flex; flex-direction: column; gap: 8px;
    animation: cardIn 0.22s var(--ease) backwards;
  }
  .skeleton-line {
    border-radius: 5px;
    background: linear-gradient(90deg, var(--border) 25%, var(--hover) 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: skeletonShimmer 1.4s ease-in-out infinite;
  }
  .skeleton-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .skeleton-line.pill { height: 16px; width: 54px; border-radius: 999px; }
  .skeleton-line.id { height: 9px; width: 34%; }
  .skeleton-line.title { height: 13px; width: 78%; margin-top: 1px; }
  .skeleton-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .skeleton-line.meta { height: 9px; width: 44%; }
  .skeleton-line.time { height: 9px; width: 18%; }

  @keyframes skeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .skeleton-line { animation: none; background: var(--border); }
  }

  .req-cat-badge {
    width: 38px; height: 38px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.01em;
  }

  .req-card-body { flex: 1; min-width: 0; }
  .req-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .req-card-id { font-size: 12px; color: var(--text-tertiary); font-weight: 650; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-card-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); line-height: 1.3; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .req-card-sub { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .req-card-meta { font-size: 12px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .req-card-time { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }

  .status-pill { font-size: 10.5px; font-weight: 750; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0; }
  .status-pending { background: var(--amber-soft); color: var(--amber); }
  .status-approved { background: var(--green-soft); color: var(--green); }
  .status-rejected { background: var(--red-soft); color: var(--red); }
  .status-for-verification { background: var(--info-soft); color: var(--info); }
  .status-default { background: var(--bg); color: var(--text-secondary); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 5px; background: currentColor; vertical-align: middle; }

  /* ---- Center + right column wrapper ---- */
  .main-and-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); min-height: 0; }
  .main-and-right-row { flex: 1; display: flex; gap: var(--gap); min-height: 0; }

  .center-column { flex: 1; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .right-column { width: var(--right-col-w); flex-shrink: 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 12px; }

  .detail-empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--text-tertiary);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  }
  .detail-empty p { margin: 0; font-size: 13.5px; font-weight: 550; }

  .detail-content { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

  /* ---- Detail toolbar: back link + pagination ---- */
  .detail-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
  .back-link {
    display: flex; align-items: center; gap: 6px; border: none; background: transparent;
    color: var(--accent); font-size: 13.5px; font-weight: 650; padding: 4px 2px;
  }
  .back-link svg { width: 15px; height: 15px; }
  .back-link:hover { text-decoration: underline; }

  .pager { display: flex; align-items: center; gap: 8px; }
  .pager-btn {
    display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    font-size: 12.5px; font-weight: 650; color: var(--text-secondary);
    transition: background 0.15s var(--ease), color 0.15s var(--ease), opacity 0.15s var(--ease);
  }
  .pager-btn svg { width: 13px; height: 13px; }
  .pager-btn:hover:not(:disabled) { background: var(--hover); color: var(--text-primary); }
  .pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .pager-label { font-size: 12.5px; font-weight: 650; color: var(--text-tertiary); padding: 5px 6px; }

  /* ---- Detail header card + tabs (single combined surface) ---- */
  .detail-header-card { padding: 0; overflow: hidden; flex-shrink: 0; }
  .detail-header-row { display: flex; align-items: center; gap: 16px; padding: 18px 20px 16px; }
  .detail-cat-badge {
    width: 52px; height: 52px; border-radius: var(--radius-md); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800;
  }
  .detail-header-main { flex: 1; min-width: 0; }
  .detail-kicker { font-size: 12.5px; color: var(--text-tertiary); font-weight: 600; margin-bottom: 3px; }
  .detail-title { font-size: 21px; font-weight: 750; letter-spacing: -0.015em; margin: 0 0 6px; line-height: 1.3; }
  .detail-meta-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary); flex-wrap: wrap; }
  .detail-meta-line .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
  .detail-meta-id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 650; color: var(--text-primary);  }
  .detail-status-pill { flex-shrink: 0; font-size: 12px; padding: 5px 13px; }

  .detail-tabs { display: none; gap: 22px; padding: 0 20px; border-top: 1px solid var(--border); }
  .detail-tab {
    border: none; background: transparent; padding: 12px 0; margin-bottom: -1px;
    font-size: 13.5px; font-weight: 650; color: var(--text-tertiary);
    border-bottom: 2px solid transparent;
    transition: color 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .detail-tab:hover { color: var(--text-primary); }
  .detail-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---- Tab panels ---- */
  .tab-panel { display: none; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
