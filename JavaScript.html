<script>
(function () {
  'use strict';

  // ==========================================================================
  // REBUILT FRONTEND — see chat message for the full list of layout changes.
  // Every google.script.run call below targets the exact same Code.gs
  // functions as before (getUserAuthStatus, authenticateWithIdToken, signOut,
  // fetchApprovalData, fetchNotifications, fetchAuditTrail,
  // updateApprovalStatus, logAuditEntry, syncApprovalToStaging,
  // getQuickLinks) with the same argument order. Only markup, styling, and
  // client-side rendering/state logic changed.
  // ==========================================================================

  const POLL_INTERVAL_MS = 30000;
  const MOBILE_BREAKPOINT = 860;
  const SIGN_OFF_APP_SOURCES = ['XCLB'];
  const XC_LABEL_APP_SOURCES = ['XCLB', 'XCSB'];
  const MODULE_LABELS = {
    JOB: 'Job Order', JO: 'Job Order', OSR: 'Office Supply', AR: 'Asset Request',
    PRF: 'Personnel Request', LEAVE: 'Leave', TRAF: 'TRAF', OBOT: 'OBOT',
    XCLB: 'Exit Clearance', XCSB: 'Exit Clearance'
  };
  const CATEGORY_CLASS_MAP = {
    OSR: 'cat-osr', XC: 'cat-xc', JO: 'cat-jo', AR: 'cat-ar', PRF: 'cat-prf',
    LEAVE: 'cat-leave', TRAF: 'cat-traf', OBOT: 'cat-obot'
  };

  const state = {
    user: null,
    sessionToken: null,
    employeePhotoCache: {}, // in-memory only, cleared on page reload — avoids re-fetching photos already seen this session
    requests: [],
    filteredRequests: [],
    activeFilter: 'All',
    searchQuery: '',
    selectedUid: null,
    activeTab: 'overview',
    pollHandle: null,
    lastNotifIds: new Set(),
    signInInitialized: false,
    auditRequestId: null,
    notifBadgeSuppressed: false,
    lastRenderedSignature: null,

    // Guards a double-submit while a decision is in flight.
    blacklistedUids: new Set(),
    // uid -> 'Approved' | 'Rejected' the CURRENT session itself recorded.
    // Any server row for one of these uids has its Status forced to this
    // value on every refresh, so a background poll that still shows
    // "Pending" (because AppSheet/its cache hasn't caught up yet) can never
    // resurface the request as actionable again.
    lockedStatusByUid: {},

    // { uid, file } — a file picked via "Add File"/"Attach File" before a
    // decision has been submitted for that uid.
    pendingAttachment: null,
    fileInputEl: null,
    fileInputTargetUid: null,

    // 'inbox' (sidebar + detail) or 'table' (all records, Pending flagged).
    activeView: 'inbox',
    tableStatusFilter: 'All',

    // Access token from the "Switch Google Account" chooser, revoked on sign-out.
    oauthAccessToken: null,
    oauthTokenClient: null
  };

  const VIEW_STORAGE_KEY = 'approvalDashboard.view';

  const el = {
    authGate: document.getElementById('auth-gate'),
    authCard: document.getElementById('auth-card'),
    authSpinner: document.getElementById('auth-spinner'),
    authStatusText: document.getElementById('auth-status-text'),
    authSignInWrap: document.getElementById('auth-signin-wrap'),
    authSignInBtn: document.getElementById('auth-signin-btn'),
    appShell: document.getElementById('app-shell'),
    appBody: document.getElementById('app-body'),

    searchInput: document.getElementById('search-input'),
    sidebarSearchInput: document.getElementById('sidebar-search-input'),

    syncBtn: document.getElementById('sync-btn'),
    notifBtn: document.getElementById('notif-btn'),
    notifBadge: document.getElementById('notif-badge'),
    notifPopover: document.getElementById('notif-popover'),
    notifList: document.getElementById('notif-list'),
    notifClearBtn: document.getElementById('notif-clear-btn'),

    linksBtn: document.getElementById('links-btn'),
    linksPopover: document.getElementById('links-popover'),
    quickLinksList: document.getElementById('quick-links-list'),

    profileChip: document.getElementById('profile-chip'),
    profileAvatar: document.getElementById('profile-avatar'),
    profileName: document.getElementById('profile-name'),
    profileRole: document.getElementById('profile-role'),
    profileMenu: document.getElementById('profile-menu'),
    profileMenuName: document.getElementById('profile-menu-name'),
    profileMenuEmail: document.getElementById('profile-menu-email'),
    profileMenuDigest: document.getElementById('profile-menu-digest'),
    switchAccountBtn: document.getElementById('switch-account-btn'),
    menuSignOutBtn: document.getElementById('menu-signout-btn'),
    logoutBtn: document.getElementById('logout-btn'),

    viewSwitch: document.getElementById('view-switch'),
    tableView: document.getElementById('table-view'),
    tableBody: document.getElementById('table-body'),
    tableEmpty: document.getElementById('table-empty'),
    tableFilter: document.getElementById('table-filter'),
    tableSummary: document.getElementById('table-summary'),

    sidebarCount: document.getElementById('sidebar-count'),
    filterPills: document.getElementById('filter-pills'),
    requestStack: document.getElementById('request-stack'),
    sidebarEmpty: document.getElementById('sidebar-empty'),

    detailEmpty: document.getElementById('detail-empty'),
    detailContent: document.getElementById('detail-content'),
    rightColumn: document.getElementById('right-column'),
    requesterBody: document.getElementById('requester-body'),
    auditTimeline: document.getElementById('audit-timeline'),
    actionDock: document.getElementById('action-dock'),

    toastContainer: document.getElementById('toast-container'),

    lightboxOverlay: document.getElementById('attachment-lightbox'),
    lightboxImage: document.getElementById('lightbox-image'),
    lightboxClose: document.getElementById('lightbox-close')
  };

  // ==========================================================================
  // BOOTSTRAP
  // ==========================================================================
  document.addEventListener('DOMContentLoaded', init);

  function init() {
    createHiddenFileInput();
    bindGlobalEvents();
    bindLinksPopover();
    bindProfileMenu();
    bindViewSwitch();
    renderSidebarSkeleton();
    checkSession();
  }

  function renderSidebarSkeleton(count) {
    count = count || 6;
    el.sidebarEmpty.classList.add('hidden');
    let html = '';
    for (let i = 0; i < count; i++) {
      html +=
        '<div class="skeleton-card" style="animation-delay:' + Math.min(i * 40, 200) + 'ms">' +
          '<div class="skeleton-top">' +
            '<div class="skeleton-line id"></div>' +
            '<div class="skeleton-line pill"></div>' +
          '</div>' +
          '<div class="skeleton-line title"></div>' +
          '<div class="skeleton-bottom">' +
            '<div class="skeleton-line meta"></div>' +
            '<div class="skeleton-line time"></div>' +
          '</div>' +
        '</div>';
    }
    el.requestStack.innerHTML = html;
  }

  function createHiddenFileInput() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*,.pdf';
    input.className = 'attach-file-input';
    input.id = 'global-attachment-input';
    document.body.appendChild(input);
    input.addEventListener('change', onFileInputChange);
    state.fileInputEl = input;
  }

  function checkSession() {
    resetAuthGate('Checking your session…');
    google.script.run
      .withSuccessHandler(onAuthResolved)
      .withFailureHandler(function (err) { onAuthResolved({ authorized: false, reason: err.message || String(err) }); })
      .getUserAuthStatus();
  }

  function resetAuthGate(message) {
    el.authGate.classList.remove('hidden');
    el.authSpinner.classList.remove('hidden');
    el.authStatusText.classList.remove('error', 'muted');
    el.authStatusText.textContent = message;
    el.authSignInWrap.classList.add('hidden');
  }

  function onAuthResolved(auth) {
    if (!auth || !auth.authorized) {
      el.authSpinner.classList.add('hidden');
      el.authStatusText.textContent = (auth && auth.reason) || 'Unauthorized User';
      el.authStatusText.classList.add(auth && auth.email ? 'muted' : 'error');
      renderAuthOptions({ mode: 'error' });
      return;
    }

    state.user = auth;
    state.sessionToken = auth.sessionToken || null;
    renderProfile(auth);

    el.authGate.classList.add('hidden');
    el.appShell.classList.remove('hidden');
    setView(readSavedView());

    bindDailyDigest();
    loadQuickLinks();
    loadApprovalData({ initial: true, forceRefresh: true });
    startPolling();
  }

  // ==========================================================================
  // SIGN-IN OPTIONS (Google Sign-In fallback)
  // ==========================================================================
    function renderAuthOptions(opts) {
    opts = opts || {};
    el.authSpinner.classList.add('hidden');
    el.authSignInWrap.classList.remove('hidden');
    el.authSignInWrap.innerHTML = '';

    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.className = 'auth-retry-btn';
    retryBtn.textContent = opts.mode === 'signedOut' ? 'Sign in again' : 'Try again';
    retryBtn.addEventListener('click', function () { checkSession(); });
    el.authSignInWrap.appendChild(retryBtn);

    const clientId = el.authCard.dataset.clientId;
    if (!clientId) return;

    const altWrap = document.createElement('div');
    altWrap.className = 'auth-alt-wrap';
    const altLabel = document.createElement('p');
    altLabel.className = 'auth-alt-label';
    altLabel.textContent = 'or sign in with a different Google account';
    altWrap.appendChild(altLabel);
    const gisHost = document.createElement('div');
    altWrap.appendChild(gisHost);
    el.authSignInWrap.appendChild(altWrap);

    waitForGoogleIdentity(function () {
      if (!state.signInInitialized) {
        google.accounts.id.initialize({
          client_id: clientId,
          callback: handleCredentialResponse,
          auto_select: false,
          cancel_on_tap_outside: true
        });
        state.signInInitialized = true;
      }
      google.accounts.id.renderButton(gisHost, {
        theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 250
      });
    });
  }

  function waitForGoogleIdentity(callback, attemptsLeft) {
    attemptsLeft = attemptsLeft === undefined ? 25 : attemptsLeft;
    if (window.google && window.google.accounts && window.google.accounts.id) { callback(); return; }
    if (attemptsLeft <= 0) return;
    setTimeout(function () { waitForGoogleIdentity(callback, attemptsLeft - 1); }, 200);
  }

  function handleCredentialResponse(response) {
    resetAuthGate('Verifying your Google account…');
    google.script.run
      .withSuccessHandler(onAuthResolved)
      .withFailureHandler(function (err) { onAuthResolved({ authorized: false, reason: err.message || String(err) }); })
      .authenticateWithIdToken(response.credential);
  }

  function openGoogleSignInPopup(clientId) {
    const redirectUri = getWebAppExecUrl_();
    console.log('Using redirect_uri:', redirectUri);
    const nonce = Utilities_generateNonce();
    state.pendingOAuthNonce = nonce;

    const params = new URLSearchParams({
      client_id: clientId,
      redirect_uri: redirectUri,
      response_type: 'id_token',
      scope: 'openid email profile',
      nonce: nonce,
      prompt: 'select_account'
    });

    const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
    const popup = window.open(authUrl, 'googleSignIn', 'width=480,height=640');

    if (!popup) {
      showToast('error', 'Popup was blocked — please allow popups for this site and try again.');
      return;
    }

    const pollTimer = setInterval(function () {
      if (popup.closed) {
        clearInterval(pollTimer);
        return;
      }
      try {
        // Once Google redirects the popup back to our own /exec URL, its
        // location becomes readable (same-origin) and carries the id_token
        // in the URL fragment.
        const url = popup.location.href;
        if (url.indexOf(redirectUri) === 0 && url.indexOf('#') !== -1) {
          const fragment = new URLSearchParams(url.split('#')[1]);
          const idToken = fragment.get('id_token');
          clearInterval(pollTimer);
          popup.close();
          if (idToken) {
            handleCredentialResponse({ credential: idToken });
          } else {
            showToast('error', 'Sign-in was cancelled or failed.');
          }
        }
      } catch (e) {
        // Cross-origin while still on accounts.google.com — expected, keep polling.
      }
    }, 400);
  }

  function getWebAppExecUrl_() {
    // window.top.location isn't readable cross-origin from inside the
    // sandboxed iframe, so the exec URL is injected server-side instead —
    // see the hidden #webapp-exec-url meta tag added in Index.html.
    const meta = document.getElementById('webapp-exec-url');
    return meta ? meta.content : window.location.href.split('?')[0];
  }

  function Utilities_generateNonce() {
    return 'n' + Date.now() + Math.random().toString(36).slice(2);
  }

  function handleCredentialResponse(response) {
    resetAuthGate('Verifying your Google account…');
    google.script.run
      .withSuccessHandler(onAuthResolved)
      .withFailureHandler(function (err) { onAuthResolved({ authorized: false, reason: err.message || String(err) }); })
      .authenticateWithIdToken(response.credential);
  }

  // ==========================================================================
  // QUICK LINKS (the header's link-icon popover)
  // ==========================================================================
  function bindLinksPopover() {
    if (!el.linksBtn) return;
    el.linksBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      el.notifPopover.classList.add('hidden');
      el.linksPopover.classList.toggle('hidden');
    });
  }

  function loadQuickLinks() {
    google.script.run
      .withSuccessHandler(renderQuickLinks)
      .withFailureHandler(function () { el.quickLinksList.innerHTML = '<div class="popover-loading">Links unavailable</div>'; })
      .getQuickLinks();
  }

  function renderQuickLinks(links) {
    links = links || [];
    if (!links.length) { el.quickLinksList.innerHTML = '<div class="popover-loading">No links configured</div>'; return; }
    el.quickLinksList.innerHTML = links.map(function (l) {
      return '<a class="links-item" href="' + escapeAttr(l.url) + '" target="_blank" rel="noopener">' +
        linkArrowIconSvg() + '<span>' + escapeHtml(l.label) + '</span></a>';
    }).join('');
  }

  // ==========================================================================
  // DATA LOADING
  // ==========================================================================
  function loadApprovalData(opts) {
    opts = opts || {};
    google.script.run
      .withSuccessHandler(function (rows) { onDataLoaded(rows, opts); if (opts.onDone) opts.onDone(); })
      .withFailureHandler(function (err) {
        if (!opts.silent) showToast('error', 'Sync failed: ' + (err.message || err));
        if (opts.onDone) opts.onDone();
      })
      .fetchApprovalData(state.sessionToken, !!opts.forceRefresh);
  }

  function onDataLoaded(rows, opts) {
    const incoming = rows || [];
    state.sidebarLoaded = true;

    // See lockedStatusByUid's comment above: never trust a server Status for
    // a uid this session already resolved — always show our own outcome.
    const merged = incoming.map(function (r) {
      const locked = state.lockedStatusByUid[r.uid];
      return locked ? Object.assign({}, r, { Status: locked }) : r;
    });

    const previousUids = new Set(state.requests.map(function (r) { return r.uid; }));
    const isNewData = merged.some(function (r) { return !previousUids.has(r.uid); });

    state.requests = merged;
    buildFilterPills();
    applyFilters();
    renderTableView();

    if (!opts.initial && isNewData) {
      showToast('info', 'New requests have arrived');
      state.notifBadgeSuppressed = false;
      checkNotifications();
    } else if (!state.notifBadgeSuppressed) {
      recomputeNotifBadgeFromState();
    }
    if (opts.initial) checkNotifications();

    if (state.selectedUid) {
      const stillExists = state.requests.find(function (r) { return r.uid === state.selectedUid; });
      if (stillExists) {
        const sig = computeRequestSignature(stillExists);
        if (sig !== state.lastRenderedSignature) renderDetail(stillExists);
      }
    }
  }

  function startPolling() {
    if (state.pollHandle) clearInterval(state.pollHandle);
    state.pollHandle = setInterval(function () { loadApprovalData({ silent: true }); }, POLL_INTERVAL_MS);
  }

  // ==========================================================================
  // FILTER PILLS, SEARCH, SIDEBAR LIST
  // ==========================================================================
  function buildFilterPills() {
    const labels = Array.from(new Set(state.requests.map(function (r) { return displayAppSource(r.AppSource); })));
    labels.sort();
    const pills = ['All'].concat(labels);

    el.filterPills.innerHTML = '';
    pills.forEach(function (label) {
      const btn = document.createElement('button');
      btn.className = 'pill' + (label === state.activeFilter ? ' active' : '');
      btn.textContent = label;
      btn.setAttribute('role', 'tab');
      btn.addEventListener('click', function () {
        state.activeFilter = label;
        Array.from(el.filterPills.children).forEach(function (c) { c.classList.remove('active'); });
        btn.classList.add('active');
        applyFilters();
      });
      el.filterPills.appendChild(btn);
    });
  }

  function bindSearchInputs() {
    function onSearchInput(e) {
      state.searchQuery = e.target.value;
      if (el.searchInput && e.target !== el.searchInput) el.searchInput.value = state.searchQuery;
      if (el.sidebarSearchInput && e.target !== el.sidebarSearchInput) el.sidebarSearchInput.value = state.searchQuery;
      applyFilters();
    }
    if (el.searchInput) el.searchInput.addEventListener('input', onSearchInput);
    if (el.sidebarSearchInput) el.sidebarSearchInput.addEventListener('input', onSearchInput);
  }

  function applyFilters() {
    const q = state.searchQuery.trim().toLowerCase();
    state.filteredRequests = state.requests.filter(function (r) {
      if ((r.Status || '').toLowerCase() !== 'pending') return false;
      const matchesSource = state.activeFilter === 'All' || displayAppSource(r.AppSource) === state.activeFilter;
      if (!matchesSource) return false;
      if (!q) return true;
      return (
        (r.Title || '').toLowerCase().indexOf(q) !== -1 ||
        (r.RequesterName || '').toLowerCase().indexOf(q) !== -1 ||
        (r.RequestID || '').toLowerCase().indexOf(q) !== -1
      );
    });
    renderRequestStack();
    updateSidebarCount();
    updatePager();
  }

  function renderRequestStack() {
    el.requestStack.innerHTML = '';
    if (state.filteredRequests.length === 0) { el.sidebarEmpty.classList.remove('hidden'); return; }
    el.sidebarEmpty.classList.add('hidden');

    state.filteredRequests.forEach(function (r, i) {
      const label = displayAppSource(r.AppSource);
      const card = document.createElement('article');
      card.className = 'req-card' + (r.uid === state.selectedUid ? ' active' : '');
      card.style.animationDelay = Math.min(i * 18, 220) + 'ms';
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.id = 'deck-card-' + r.uid;
      card.dataset.uid = r.uid;

      card.innerHTML =
        '<div class="req-card-body">' +
          '<div class="req-card-top">' +
            '<span class="req-card-id">' + escapeHtml(r.RequestID) + '</span>' +
            statusPillHtml(r.Status) +
          '</div>' +
          '<div class="req-card-title">' + escapeHtml(r.Title) + '</div>' +
          '<div class="req-card-sub">' +
            '<span class="req-card-meta">' + escapeHtml(moduleLabelFor(r.AppSource)) + ' • ' + escapeHtml(r.RequesterName) + '</span>' +
            '<span class="req-card-time">' + relativeTime(r.CreatedAt) + '</span>' +
          '</div>' +
        '</div>';

      card.addEventListener('click', function () { selectItem(r.uid); });
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectItem(r.uid); } });

      el.requestStack.appendChild(card);
    });
  }

  function updateSidebarCount() { el.sidebarCount.textContent = String(state.filteredRequests.length); }

  function updateCardPill(uid, status) {
    const card = document.getElementById('deck-card-' + uid);
    if (!card) return;
    const pillEl = card.querySelector('.status-pill');
    if (pillEl) pillEl.outerHTML = statusPillHtml(status);
  }

  // ==========================================================================
  // SELECT / CLOSE / NAVIGATE
  // ==========================================================================
  function selectItem(uid) {
    const wasInDetail = isMobileView() && el.appBody.classList.contains('show-detail');

    state.selectedUid = uid;
    state.activeTab = 'overview';
    Array.from(el.requestStack.children).forEach(function (card) { card.classList.toggle('active', card.dataset.uid === uid); });
    const r = state.requests.find(function (x) { return x.uid === uid; });
    if (r) renderDetail(r);

    if (isMobileView()) {
      showDetailViewMobile();
      if (!wasInDetail) {
        try { history.pushState({ approvalDetailView: true }, ''); } catch (e) { /* non-fatal */ }
      }
    }
  }

  function closeDetail() {
    // On mobile, if we got here from a real navigation (back button/back
    // gesture pressed a history entry we pushed), just undo the UI state —
    // don't push/pop history again, popstate already fired.
    if (isMobileView() && history.state && history.state.approvalDetailView) {
      history.back();
      return;
    }
    performCloseDetail();
  }

  function performCloseDetail() {
    state.selectedUid = null;
    Array.from(el.requestStack.children).forEach(function (card) { card.classList.remove('active'); });
    el.detailContent.classList.add('hidden');
    el.detailEmpty.classList.remove('hidden');
    el.rightColumn.classList.add('hidden');
    el.actionDock.classList.add('hidden');
    if (isMobileView()) showListView();
  }

  function goToNextRequest() {
    const list = state.filteredRequests;
    if (list.length < 2) return;
    const idx = list.findIndex(function (r) { return r.uid === state.selectedUid; });
    selectItem(list[idx === -1 ? 0 : (idx + 1) % list.length].uid);
  }

  function goToPreviousRequest() {
    const list = state.filteredRequests;
    if (list.length < 2) return;
    const idx = list.findIndex(function (r) { return r.uid === state.selectedUid; });
    selectItem(list[idx === -1 ? 0 : (idx - 1 + list.length) % list.length].uid);
  }

  function updatePager() {
    const label = document.getElementById('pager-label');
    if (!label) return;
    const idx = state.filteredRequests.findIndex(function (r) { return r.uid === state.selectedUid; });
    const total = state.filteredRequests.length;
    label.textContent = (idx === -1 ? '—' : (idx + 1)) + ' of ' + total;
    const disabled = total < 2;
    const prevBtn = document.getElementById('pager-prev');
    const nextBtn = document.getElementById('pager-next');
    if (prevBtn) prevBtn.disabled = disabled;
    if (nextBtn) nextBtn.disabled = disabled;
  }

  // ==========================================================================
  // MOBILE NAV
  // ==========================================================================
  function isMobileView() { return window.innerWidth <= MOBILE_BREAKPOINT; }
  function showListView() { el.appBody.classList.remove('show-detail'); el.appShell.classList.remove('detail-open'); }
  function showDetailViewMobile() { el.appBody.classList.add('show-detail'); el.appShell.classList.add('detail-open'); }

  // ==========================================================================
  // DETAIL RENDER — header card + tabs + tab panels + right column + dock
  // ==========================================================================
  function renderDetail(r) {
    state.lastRenderedSignature = computeRequestSignature(r);

    el.detailEmpty.classList.add('hidden');
    el.detailContent.classList.remove('hidden');
    el.rightColumn.classList.remove('hidden');
    el.actionDock.classList.remove('hidden');

    const label = displayAppSource(r.AppSource);
    const appSourceUpperForHeader = (r.AppSource || '').toString().trim().toUpperCase();
    const showEmployeePhoto = appSourceUpperForHeader === 'XCLB';
    const headerDetails = parseDetailsJson(r.DetailsJSON);
    const fullName = findDetailValue(headerDetails, 'full name') || r.Title;

    el.detailContent.innerHTML =
      '<div class="detail-toolbar">' +
        '<button type="button" class="back-link" id="back-to-requests-btn">' + arrowLeftIconSvg() + '<span>Back to Requests</span></button>' +
        '<div class="pager">' +
          '<button type="button" class="pager-btn" id="pager-prev">' + chevronLeftIconSvg() + '<span>Previous</span></button>' +
          '<span class="pager-label" id="pager-label">1 of 1</span>' +
          '<button type="button" class="pager-btn" id="pager-next"><span>Next</span>' + chevronRightIconSvg() + '</button>' +
        '</div>' +
      '</div>' +

      '<div class="detail-header-card surface-card">' +
        '<div class="detail-header-row">' +
          (showEmployeePhoto
            ? '<div class="summary-photo" id="employee-photo" data-photo-trigger role="button" tabindex="0" aria-label="View full photo">' + escapeHtml(initials(fullName)) + '</div>'
            : '') +
          '<div class="detail-header-main">' +
            //'<div class="detail-kicker">' + escapeHtml(moduleLabelFor(r.AppSource)) + ' Request</div>' +
            '<h2 class="detail-title">' + escapeHtml(r.Title) + '</h2>' +
            '<div class="detail-meta-line">' +
              '<span class="detail-meta-id">' + escapeHtml(r.RequestID) + '</span>' +
              '<span class="dot"></span><span>' + escapeHtml(formatDateLong(r.CreatedAt)) + '</span>' +
              '<span class="dot"></span><span>Created ' + relativeTime(r.CreatedAt) + '</span>' +
            '</div>' +
          '</div>' +
          statusPillHtml(r.Status, 'detail-status-pill') +
        '</div>' +
        '<div class="detail-tabs" role="tablist">' + tabButtonsHtml() + '</div>' +
      '</div>' +

      '<div class="tab-panel' + (state.activeTab === 'overview' ? ' active' : '') + '" data-tab-panel="overview">' + overviewPanelHtml(r) + '</div>' +
      '<div class="tab-panel' + (state.activeTab === 'history' ? ' active' : '') + '" data-tab-panel="history">' + historyPanelPlaceholderHtml() + '</div>' +
      '<div class="tab-panel' + (state.activeTab === 'attachments' ? ' active' : '') + '" data-tab-panel="attachments">' + attachmentsPanelHtml(r) + '</div>' +
      '<div class="tab-panel' + (state.activeTab === 'comments' ? ' active' : '') + '" data-tab-panel="comments">' + commentsPanelPlaceholderHtml() + '</div>';

        el.actionDock.innerHTML = buildActionDockHtml(r);

      renderRequesterCard(r);
    ensureAttachmentsSidebarCard(r);
    ensureHelpCard();
    bindDetailEvents(r);
    updatePager();
    bindAttachmentPreviewFallback();
    loadAuditTrail(r.RequestID);

    if ((r.AppSource || '').toString().trim().toUpperCase() === 'XCLB') loadEmployeePhoto(r);
  }

    function tabButtonsHtml() {
    const tabs = [['overview', 'Overview']];
    return tabs.map(function (t) {
      return '<button type="button" class="detail-tab' + (state.activeTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('');

  function switchTab(tabName) {
    state.activeTab = tabName;
    Array.from(document.querySelectorAll('.detail-tab')).forEach(function (btn) { btn.classList.toggle('active', btn.dataset.tab === tabName); });
    Array.from(document.querySelectorAll('.tab-panel')).forEach(function (panel) { panel.classList.toggle('active', panel.dataset.tabPanel === tabName); });
  }

  function bindDetailEvents(r) {
    document.getElementById('back-to-requests-btn').addEventListener('click', closeDetail);
    const prevBtn = document.getElementById('pager-prev');
    const nextBtn = document.getElementById('pager-next');
    if (prevBtn) prevBtn.addEventListener('click', goToPreviousRequest);
    if (nextBtn) nextBtn.addEventListener('click', goToNextRequest);

    Array.from(document.querySelectorAll('.detail-tab')).forEach(function (btn) {
      btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
    });

    Array.from(document.querySelectorAll('[data-add-file]')).forEach(function (btn) {
      btn.addEventListener('click', function () { triggerAttachmentPicker(r); });
    });

      Array.from(document.querySelectorAll('[data-remove-pending-attachment]')).forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); clearPendingAttachment(r); });
    });

    const photoTrigger = document.getElementById('employee-photo');
    if (photoTrigger) {
      photoTrigger.addEventListener('click', function () {
        if (photoTrigger.dataset.fullSrc) openLightbox(photoTrigger.dataset.fullSrc);
      });
      photoTrigger.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && photoTrigger.dataset.fullSrc) {
          e.preventDefault();
          openLightbox(photoTrigger.dataset.fullSrc);
        }
      });
    }

    bindActionDockEvents(r);
  }

  function applyPhotoToElement_(elementId, url, expectedUid, imgClass) {
    if (state.selectedUid !== expectedUid || !url) return;
    const target = document.getElementById(elementId);
    if (!target) return;
    const img = new Image();
    img.onload = function () {
      if (state.selectedUid !== expectedUid) return;
      const current = document.getElementById(elementId);
      if (!current) return;
      current.innerHTML = '';
      current.classList.add('has-photo');
      current.dataset.fullSrc = url;
      img.className = imgClass;
      img.alt = 'Photo';
      current.appendChild(img);
      requestAnimationFrame(function () { img.classList.add('loaded'); });
    };
    img.onerror = function () {};
    img.src = url;
  }

  function loadRequesterPhotoByEmail(r) {
    const avatarEl = document.getElementById('requester-avatar');
    if (!avatarEl) return;

    const cacheKey = 'email:' + r.RequesterEmail.toLowerCase();
    const cachedUrl = state.employeePhotoCache[cacheKey];
    if (cachedUrl) { applyPhotoToElement_('requester-avatar', cachedUrl, r.uid, 'avatar-photo'); return; }

    google.script.run
      .withSuccessHandler(function (url) {
        if (!url) return;
        state.employeePhotoCache[cacheKey] = url;
        applyPhotoToElement_('requester-avatar', url, r.uid, 'avatar-photo');
      })
      .withFailureHandler(function () {})
      .getEmployeeImageUrlByEmail(r.RequesterEmail, state.sessionToken);
  }
  
  function loadEmployeePhoto(r) {
    const details = parseDetailsJson(r.DetailsJSON);
    const employeeNo = findDetailValue(details, 'employee no.') || findDetailValue(details, 'employee no');
    if (!employeeNo) return;

    const photoEl = document.getElementById('employee-photo');
    if (!photoEl) return;

    const cacheKey = 'empno:' + employeeNo.toLowerCase();
    const cachedUrl = state.employeePhotoCache[cacheKey];
    if (cachedUrl) { applyPhotoToElement_('employee-photo', cachedUrl, r.uid, 'summary-photo-img'); return; }

    google.script.run
      .withSuccessHandler(function (url) {
        if (!url) return;
        state.employeePhotoCache[cacheKey] = url;

      .withFailureHandler(function () {})
      .getEmployeeImageUrl(employeeNo, state.sessionToken);

  // ---------------------------------------------------------------------
  // AUDIT TRAIL — right column timeline + Approval History tab + Comments
  // tab, all derived from one fetchAuditTrail(requestId, sessionToken) call.
  // ---------------------------------------------------------------------
  function loadAuditTrail(requestId) {
    state.auditRequestId = requestId;
    el.auditTimeline.innerHTML = '<div class="timeline-loading">Loading history…</div>';
    const histBody = document.getElementById('history-list-body');
    if (histBody) histBody.innerHTML = '<div class="history-loading">Loading history…</div>';
    const commentsBody = document.getElementById('comments-list-body');
    if (commentsBody) commentsBody.innerHTML = '<div class="history-loading">Loading comments…</div>';

    google.script.run
      .withSuccessHandler(function (items) { onAuditTrailLoaded(requestId, items); })
      .withFailureHandler(function () { onAuditTrailLoaded(requestId, null); })
      .fetchAuditTrail(requestId, state.sessionToken);
  }

  function onAuditTrailLoaded(requestId, items) {
    if (state.auditRequestId !== requestId) return;
    const r = state.requests.find(function (x) { return x.RequestID === requestId; });
    renderAuditTimeline(items, r);
    renderHistoryPanel(items);
    renderCommentsPanel(items);
  }

  function renderAuditTimeline(items, r) {
    const list = items || [];
    const rows = [];
    const isPending = r && (r.Status || '').toLowerCase() === 'pending';

    if (isPending) {
      rows.push(
        '<div class="timeline-item">' +
          '<div class="timeline-dot current">' + clockIconSvg() + '</div>' +
          '<div class="timeline-body">' +
            '<div class="timeline-name">' + escapeHtml((state.user && state.user.name) || (r && r.AprEmail) || 'Approver') + '</div>' +
            '<div class="timeline-desc">Awaiting approval</div>' +
            '<div class="timeline-time">Current step</div>' +
          '</div>' +
        '</div>'
      );
    }

    list.forEach(function (a) {
      const isApproved = (a.Action || '').toLowerCase() === 'approved';
      rows.push(
        '<div class="timeline-item">' +
          '<div class="timeline-dot ' + (isApproved ? 'approved' : 'rejected') + '">' + (isApproved ? checkIconSvg() : xIconSvg()) + '</div>' +
          '<div class="timeline-body">' +
            '<div class="timeline-name">' + escapeHtml(a.ActorName || a.ActorEmail || 'Someone') + '</div>' +
            '<div class="timeline-desc">' + (isApproved ? 'Approved this request' : 'Rejected this request') + '</div>' +
            '<div class="timeline-time">' + relativeTime(a.Timestamp) + '</div>' +
          '</div>' +
        '</div>'
      );
    });

    if (r) {
      rows.push(
        '<div class="timeline-item">' +
          '<div class="timeline-dot submitted"></div>' +
          '<div class="timeline-body">' +
            '<div class="timeline-name">' + escapeHtml(r.RequesterName || 'Requester') + '</div>' +
            '<div class="timeline-desc">Request submitted</div>' +
            '<div class="timeline-time">' + relativeTime(r.CreatedAt) + '</div>' +
          '</div>' +
        '</div>'
      );
    }

    el.auditTimeline.innerHTML = rows.length ? rows.join('') : '<div class="timeline-empty">No history available.</div>';
  }

  function renderHistoryPanel(items) {
    const body = document.getElementById('history-list-body');

      body.innerHTML = '<div class="history-empty">No history yet — this is the first action on this request.</div>';

            (a.Comment ? '<div class="history-comment">' + escapeHtml(a.Comment) + '</div>' : '') +

  // ==========================================================================
  // ATTACHMENTS — shared list/preview builders + pre-decision file picker
  // ==========================================================================
  function hasPendingAttachment(uid) { return !!(state.pendingAttachment && state.pendingAttachment.uid === uid); }

  function attachmentFileName(path) {
    if (!path) return '';
    const clean = path.split('?')[0];
    const parts = clean.split('/');
    try { return decodeURIComponent(parts[parts.length - 1] || path); } catch (e) { return parts[parts.length - 1] || path; }
  }

  function attachmentIconFor(path) {
    if (/\.pdf(\?.*)?$/i.test(path || '')) return { cls: 'pdf', svg: pdfIconSvg() };
    if (isImageAttachment(path)) return { cls: 'image', svg: imageIconSvg() };
    return { cls: 'generic', svg: genericFileIconSvg() };
  }

  function buildAttachmentRowsHtml(r) {
    const rows = [];
    if (r.attachment) {
      const icon = attachmentIconFor(r.attachment);
      const url = r.attachmentUrl || r.attachment;
      rows.push(
        '<a class="attachment-row" href="' + escapeAttr(url) + '" target="_blank" rel="noopener">' +
          '<div class="attachment-file-icon ' + icon.cls + '">' + icon.svg + '</div>' +
          '<div class="attachment-row-body">' +
            '<div class="attachment-row-name">' + escapeHtml(attachmentFileName(r.attachment)) + '</div>' +
            '<div class="attachment-row-sub">Submitted with request</div>' +
          '</div>' +
          '<span class="attachment-row-menu">' + dotsIconSvg() + '</span>' +
        '</a>'
      );
    }
    if (hasPendingAttachment(r.uid)) {
      const f = state.pendingAttachment.file;
      rows.push(
        '<div class="attachment-row">' +
          '<div class="attachment-file-icon generic">' + genericFileIconSvg() + '</div>' +
          '<div class="attachment-row-body">' +
            '<div class="attachment-row-name">' + escapeHtml(f.name) + '</div>' +
            '<div class="attachment-row-sub">Ready to upload with your decision</div>' +
          '</div>' +
          '<button type="button" class="attachment-row-menu" data-remove-pending-attachment aria-label="Remove attachment">' + closeIconSvgSmall() + '</button>' +
        '</div>'
      );
    }
    if (!rows.length) return '<div class="attachment-empty">No attachments yet.</div>';
    return rows.join('');
  }

  function buildAttachmentPreviewHtml(r) {
    if (!r.attachment || !isImageAttachment(r.attachment)) return '';
    const resolved = resolveAttachmentPreviewUrl(r.attachmentUrl || r.attachment);
    return (
      '<div class="attachment-preview-large" data-full-src="' + escapeAttr(resolved.previewUrl) + '">' +
        '<img src="' + escapeAttr(resolved.previewUrl) + '" data-fallback-src="' + escapeAttr(resolved.fallbackUrl) + '" alt="Attachment preview" loading="lazy">' +
        '<div class="attachment-preview-hint">Click to enlarge</div>' +
      '</div>'
    );
  }

  function refreshAttachmentDisplays(r) {
    const ov = document.getElementById('attachment-list-overview');
    if (ov) ov.innerHTML = buildAttachmentRowsHtml(r);
    const full = document.getElementById('attachment-list-full');
    if (full) full.innerHTML = buildAttachmentRowsHtml(r);

    Array.from(document.querySelectorAll('[data-remove-pending-attachment]')).forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); clearPendingAttachment(r); });
    });

    const attachBtn = document.getElementById('attach-file-trigger');
    const attachLabel = document.getElementById('attach-file-label');
    if (attachBtn && attachLabel) {
      const has = hasPendingAttachment(r.uid);
      attachBtn.classList.toggle('has-file', has);
      attachLabel.textContent = has ? state.pendingAttachment.file.name : 'Attach File';
    }
  }

  function triggerAttachmentPicker(r) {
    state.fileInputTargetUid = r.uid;
    state.fileInputEl.value = '';
    state.fileInputEl.click();
  }

  function onFileInputChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    state.pendingAttachment = { uid: state.fileInputTargetUid, file: file };
    const r = state.requests.find(function (x) { return x.uid === state.fileInputTargetUid; });
    if (r) refreshAttachmentDisplays(r);
  }

  function clearPendingAttachment(r) {
    if (state.pendingAttachment && state.pendingAttachment.uid === r.uid) {
      state.pendingAttachment = null;
      refreshAttachmentDisplays(r);
    }
  }

  // ---- Google Drive preview URL fix (reused as-is) ----
  function extractDriveFileId(url) {
    if (!url) return '';
    const patterns = [/\/file\/d\/([a-zA-Z0-9_-]{10,})/, /[?&]id=([a-zA-Z0-9_-]{10,})/, /\/d\/([a-zA-Z0-9_-]{10,})/];
    for (let i = 0; i < patterns.length; i++) { const m = url.match(patterns[i]); if (m && m[1]) return m[1]; }
    return '';
  }
  function resolveAttachmentPreviewUrl(rawUrl) {
    if (!rawUrl) return { previewUrl: '', fallbackUrl: '', isDrive: false };
    const isDriveHost = /drive\.google\.com|googleusercontent\.com/i.test(rawUrl);
    if (!isDriveHost) return { previewUrl: rawUrl, fallbackUrl: '', isDrive: false };
    const fileId = extractDriveFileId(rawUrl);
    if (!fileId) return { previewUrl: rawUrl, fallbackUrl: '', isDrive: true };
    return { previewUrl: 'https://lh3.googleusercontent.com/d/' + fileId, fallbackUrl: 'https://drive.google.com/uc?export=view&id=' + fileId, isDrive: true };
  }
  function isImageAttachment(path) { return /\.(png|jpe?g|gif|webp|bmp|svg)(\?.*)?$/i.test(path || ''); }

  function bindAttachmentPreviewFallback() {
    const viewer = document.querySelector('#detail-content .attachment-preview-large');
    if (!viewer) return;
    const img = viewer.querySelector('img');
    if (img) {
      img.addEventListener('error', function onError() {
        const fallback = img.dataset.fallbackSrc;
        if (fallback && img.dataset.fallbackTried !== '1') { img.dataset.fallbackTried = '1'; img.src = fallback; viewer.dataset.fullSrc = fallback; return; }
        viewer.classList.add('broken');
      });
    }
    viewer.addEventListener('click', function () { if (!viewer.classList.contains('broken')) openLightbox(viewer.dataset.fullSrc); });
  }

  function openLightbox(src) { if (!src) return; el.lightboxImage.src = src; el.lightboxOverlay.classList.remove('hidden'); }
  function closeLightbox() { el.lightboxOverlay.classList.add('hidden'); el.lightboxImage.src = ''; }

  // ==========================================================================
  // ACTION DOCK — Attach File / comment / Approve-Reject (or Sign Off)
  // ==========================================================================
  function buildActionDockHtml(r) {
    const isPending = (r.Status || '').toLowerCase() === 'pending';
    if (!isPending) return decidedDockHtml(r);

    const appSourceUpper = (r.AppSource || '').toString().trim().toUpperCase();
    const isSignOffOnly = SIGN_OFF_APP_SOURCES.indexOf(appSourceUpper) !== -1;
    const attachHas = hasPendingAttachment(r.uid);

    return (
      (canAttachFile(r)
        ? '<button type="button" class="attach-file-btn' + (attachHas ? ' has-file' : '') + '" id="attach-file-trigger">' +
            paperclipIconSvg() + '<span id="attach-file-label">' + (attachHas ? escapeHtml(state.pendingAttachment.file.name) : 'Attach File') + '</span>' +
          '</button>'
        : '') +
      '<div class="comment-input-wrap">' +
        '<input type="text" class="comment-input" id="comment-input" maxlength="500" placeholder="Add a comment (optional)">' +
        '<span class="comment-counter" id="comment-counter">0/500</span>' +
      '</div>' +
      (isSignOffOnly
        ? '<button type="button" class="action-btn btn-signoff" id="signoff-btn">' + checkIconSvg() + '<span>Sign Off</span></button>'
        : '<button type="button" class="action-btn btn-reject" id="reject-btn">' + xIconSvg() + '<span>Reject</span></button>' +
          '<button type="button" class="action-btn btn-approve" id="approve-btn">' + checkIconSvg() + '<span>Approve</span></button>')
    );
  }

  function decidedDockHtml(r) {
    const status = r.Status || '—';
    const s = status.toLowerCase();
    const wasLockedHere = !!state.lockedStatusByUid[r.uid];
    const color = s === 'approved' ? 'var(--green)' : (s === 'rejected' ? 'var(--red)' : 'var(--text-secondary)');
    const text = wasLockedHere ? 'Your response has been recorded.' : ('This request is marked as ' + status + '.');
    return '<div class="decided-banner" style="color:' + color + '">' + decidedIconFor(status) + '<span>' + escapeHtml(text) + '</span></div>';
  }

  function decidedIconFor(status) {
    const s = (status || '').toLowerCase();
    if (s === 'approved') return checkIconSvg();
    if (s === 'rejected') return xIconSvg();
    return infoIconSvg();
  }

  function bindActionDockEvents(r) {
    const attachTrigger = document.getElementById('attach-file-trigger');
    if (attachTrigger) attachTrigger.addEventListener('click', function () { triggerAttachmentPicker(r); });

    const commentEl = document.getElementById('comment-input');
    const counterEl = document.getElementById('comment-counter');
    if (commentEl && counterEl) commentEl.addEventListener('input', function () { counterEl.textContent = commentEl.value.length + '/500'; });

    const approveBtn = document.getElementById('approve-btn');
    const rejectBtn = document.getElementById('reject-btn');
    const signoffBtn = document.getElementById('signoff-btn');
    if (approveBtn) approveBtn.addEventListener('click', function () { submitDecision(r, 'Approved'); });
    if (rejectBtn) rejectBtn.addEventListener('click', function () { submitDecision(r, 'Rejected'); });
    if (signoffBtn) signoffBtn.addEventListener('click', function () { submitDecision(r, 'Approved'); });
  }

  // ==========================================================================
  // APPROVE / REJECT / SIGN OFF
  // ==========================================================================
  function submitDecision(request, action) {
    if (state.blacklistedUids.has(request.uid)) return; // guard double-submit
    state.blacklistedUids.add(request.uid);

    const commentEl = document.getElementById('comment-input');
    const comment = commentEl ? commentEl.value : '';
    const pendingFile = hasPendingAttachment(request.uid) ? state.pendingAttachment.file : null;

    renderSavingDock(action);

    if (pendingFile) {
      const reader = new FileReader();
      reader.onload = function () {
        const base64 = String(reader.result).split(',')[1] || '';
        proceedWithDecision(request, action, comment, { name: pendingFile.name, mimeType: pendingFile.type || 'application/octet-stream', base64: base64 });
      };
      reader.onerror = function () { proceedWithDecision(request, action, comment, null); };
      reader.readAsDataURL(pendingFile);
    } else {
      proceedWithDecision(request, action, comment, null);
    }
  }

  function renderSavingDock(action) {
    el.actionDock.innerHTML =
      '<div class="decided-banner">' +
        '<span class="auth-spinner" style="width:15px;height:15px;border-width:2px;"></span>' +
        '<span>Saving your ' + (action === 'Approved' ? 'approval' : 'response') + '…</span>' +
      '</div>';
  }

  function proceedWithDecision(request, action, comment, attachmentData) {
    google.script.run
      .withSuccessHandler(function (result) {
        request.Status = action;
        state.lockedStatusByUid[request.uid] = action;
        if (state.pendingAttachment && state.pendingAttachment.uid === request.uid) state.pendingAttachment = null;

        updateCardPill(request.uid, action);

        // Fire-and-forget, exactly as before: a failure here can never look
        // like a failed approve/reject since the primary write already
        // succeeded.
        google.script.run
          .withFailureHandler(function (err) { showToast('error', 'Decision saved, but the audit log entry failed: ' + (err.message || err)); })
          .logAuditEntry(request.RequestID, action, comment, state.sessionToken, request.uid, result && result.decisionAttachmentUrl);
        google.script.run
          .withFailureHandler(function (err) { console.warn('Staging sync failed (non-fatal): ' + (err.message || err)); })
          .syncApprovalToStaging(request.RequestID, action, comment, state.sessionToken, request.uid, result && result.decisionAttachmentUrl);

        showToast('success', 'Request ' + request.RequestID + ' ' + action.toLowerCase() + '.');

        if (state.selectedUid === request.uid) {
          el.actionDock.innerHTML = buildActionDockHtml(request);
          const pillHost = document.querySelector('.detail-status-pill');
          if (pillHost) pillHost.outerHTML = statusPillHtml(action, 'detail-status-pill');
          loadAuditTrail(request.RequestID);
        }
        recomputeNotifBadgeFromState();
      })
      .withFailureHandler(function (err) { handleDecisionFailure(request, err); })
      .updateApprovalStatus(request.RequestID, action, attachmentData, state.sessionToken, request.uid, comment);
  }

  function handleDecisionFailure(request, err) {
    state.blacklistedUids.delete(request.uid);
    if (state.selectedUid === request.uid) {
      el.actionDock.innerHTML = buildActionDockHtml(request);
      bindActionDockEvents(request);
    }
    showToast('error', 'Action failed — please try again: ' + (err && err.message ? err.message : err));
  }

  // ==========================================================================
  // NOTIFICATIONS
  // ==========================================================================
  function checkNotifications() {
    google.script.run.withSuccessHandler(renderNotifications).withFailureHandler(function () {}).fetchNotifications(state.sessionToken);
  }

  function notifHeaderState(status) {
    const s = (status || 'Pending').toLowerCase();
    if (s === 'approved') return { label: 'Approved', cls: 'state-approved' };
    if (s === 'rejected') return { label: 'Rejected', cls: 'state-rejected' };
    return { label: 'New Request', cls: 'state-new' };
  }

  function renderNotifications(items) {
    items = items || [];
    items.forEach(function (r) { state.lastNotifIds.add(r.uid); });
    if (!state.notifBadgeSuppressed) updateNotifBadge(items.filter(function (r) { return (r.Status || '').toLowerCase() === 'pending'; }).length);

    el.notifList.innerHTML = items.length ? items.map(function (r) {
      const hs = notifHeaderState(r.Status);
      return (
        '<div class="popover-item" data-uid="' + escapeAttr(r.uid) + '">' +
          '<div class="popover-item-header ' + hs.cls + '">' + hs.label + '</div>' +
          '<div class="popover-item-sub">' +
            '<span class="popover-sub-text">' + escapeHtml(r.Title) + ' • ' + escapeHtml(r.RequesterName) + '</span>' +
            '<span class="popover-sub-time">' + relativeTime(r.CreatedAt) + '</span>' +
          '</div>' +
        '</div>'
      );
    }).join('') : '<div class="popover-empty">You\'re all caught up.</div>';

    Array.from(el.notifList.querySelectorAll('.popover-item')).forEach(function (node) {
      node.addEventListener('click', function () { selectItem(node.dataset.uid); el.notifPopover.classList.add('hidden'); });
    });
  }

  function recomputeNotifBadgeFromState() {
    if (state.notifBadgeSuppressed) return;
    const pendingCount = state.requests.filter(function (r) { return (r.Status || '').toLowerCase() === 'pending'; }).length;
    updateNotifBadge(pendingCount);
  }

  function updateNotifBadge(count) {
    if (count > 0) { el.notifBadge.textContent = count > 99 ? '99+' : String(count); el.notifBadge.classList.remove('hidden'); }
    else { el.notifBadge.textContent = '0'; el.notifBadge.classList.add('hidden'); }
  }

  function clearAllNotifications() {
    state.lastNotifIds.clear();
    el.notifList.innerHTML = '<div class="popover-empty">You\'re all caught up.</div>';
    state.notifBadgeSuppressed = true;
    updateNotifBadge(0);
  }

  function bindViewSwitch() {
    el.viewSwitch.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-view]');
      if (btn) setView(btn.dataset.view, true);
    });
    el.tableFilter.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-status]');
      if (!btn) return;
      state.tableStatusFilter = btn.dataset.status;
      setActiveSegment(el.tableFilter, 'status', state.tableStatusFilter);
      renderTableView();
    });
  }

  function readSavedView() {
    try { return localStorage.getItem(VIEW_STORAGE_KEY) === 'table' ? 'table' : 'inbox'; } catch (e) { return 'inbox'; }
  }

  function setView(view, remember) {
    state.activeView = view === 'table' ? 'table' : 'inbox';
    const isTable = state.activeView === 'table';
    el.appBody.classList.toggle('hidden', isTable);
    el.tableView.classList.toggle('hidden', !isTable);
    setActiveSegment(el.viewSwitch, 'view', state.activeView);
    if (isTable) {
      el.appShell.classList.remove('detail-open');
      renderTableView();
    }
    if (remember) {
      try { localStorage.setItem(VIEW_STORAGE_KEY, state.activeView); } catch (e) {}
    }
  }

  function setActiveSegment(container, dataKey, value) {
    Array.from(container.querySelectorAll('.segmented-btn')).forEach(function (b) {
      const on = b.dataset[dataKey] === value;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  function isPendingStatus(r) { return (r.Status || '').toLowerCase() === 'pending'; }

  function renderTableView() {
    if (!el.tableBody) return;
    const pendingCount = state.requests.filter(isPendingStatus).length;
    el.tableSummary.textContent = state.requests.length + ' total · ' + pendingCount + ' pending';

    const filter = state.tableStatusFilter;
    const rows = state.requests
      .filter(function (r) { return filter === 'All' || (r.Status || '').toLowerCase() === filter.toLowerCase(); })
      .slice()
      // Pending first; within each group keep the server's newest-first order.
      .sort(function (a, b) { return (isPendingStatus(b) ? 1 : 0) - (isPendingStatus(a) ? 1 : 0); });

    el.tableEmpty.textContent = state.sidebarLoaded ? 'No requests to show.' : 'Loading…';
    el.tableEmpty.classList.toggle('hidden', rows.length > 0);
    el.tableBody.innerHTML = rows.map(function (r) {
      return '<tr class="' + (isPendingStatus(r) ? 'is-pending' : '') + '" data-uid="' + escapeAttr(r.uid) + '" tabindex="0">' +
        '<td class="cell-id">' + escapeHtml(r.RequestID) + '</td>' +
        '<td class="col-module">' + escapeHtml(moduleLabelFor(r.AppSource)) + '</td>' +
        '<td class="cell-title">' + escapeHtml(r.Title) + '</td>' +
        '<td class="col-requester">' + escapeHtml(r.RequesterName) + '</td>' +
        '<td class="col-created" title="' + escapeAttr(formatDateTime(r.CreatedAt)) + '">' + relativeTime(r.CreatedAt) + '</td>' +
        '<td>' + statusPillHtml(r.Status) + '</td>' +
      '</tr>';
    }).join('');

    Array.from(el.tableBody.querySelectorAll('tr')).forEach(function (tr) {
      const open = function () { setView('inbox', true); selectItem(tr.dataset.uid); };
      tr.addEventListener('click', open);
      tr.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  }

  // Binds the signed-in Google account as this user's aprEmail for the daily
  // Pending digest (see bindReminderRecipient / runAprEmailDigest).
  function bindDailyDigest() {
    el.profileMenuDigest.textContent = 'Setting up daily reminders…';
    const tokenAtCall = state.sessionToken;
    google.script.run
      .withSuccessHandler(function (info) {
        if (state.sessionToken !== tokenAtCall || !info) return;
        const hour = info.hour % 12 || 12;
        el.profileMenuDigest.textContent =
          'Daily Pending reminder at ' + hour + (info.hour < 12 ? ' AM' : ' PM') + ' to ' + info.aprEmail;
      })
      .withFailureHandler(function () {
        if (state.sessionToken !== tokenAtCall) return;
        el.profileMenuDigest.textContent = 'Daily reminders could not be set up.';
      })
      .bindReminderRecipient(state.sessionToken);

    function toggleProfileMenu(force) {
    if (!el.profileMenu) return;
    const show = force === undefined ? el.profileMenu.classList.contains('hidden') : force;
    el.profileMenu.classList.toggle('hidden', !show);
    el.profileChip.setAttribute('aria-expanded', show ? 'true' : 'false');
  }

  function resetAppForSignedOutState() {
    if (state.pollHandle) { clearInterval(state.pollHandle); state.pollHandle = null; }
    performCloseDetail();
    state.user = null;
    state.sessionToken = null;
    state.requests = [];
    state.filteredRequests = [];
    state.selectedUid = null;
    state.sidebarLoaded = false;
    state.blacklistedUids = new Set();
    state.lockedStatusByUid = {};
    state.lastNotifIds = new Set();
    state.pendingAttachment = null;
    el.requestStack.innerHTML = '';
    el.tableBody.innerHTML = '';
    el.notifList.innerHTML = '';
    updateNotifBadge(0);
    el.appShell.classList.add('hidden');
    toggleProfileMenu(false);
  }

  function revokeOAuthAccessToken() {
    const token = state.oauthAccessToken;
    state.oauthAccessToken = null;
    if (token && window.google && google.accounts && google.accounts.oauth2) {
      try { google.accounts.oauth2.revoke(token, function () {}); } catch (e) {}
    }
  }

  function handleSignOut() {
    toggleProfileMenu(false);
    const tokenToClear = state.sessionToken;

    if (window.google && window.google.accounts && window.google.accounts.id) {
      try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    }
    revokeOAuthAccessToken();

    google.script.run
      .withSuccessHandler(function () {
        resetAppForSignedOutState();
        resetAuthGate('You have been signed out.');
        el.authStatusText.classList.add('muted');
        renderAuthOptions({ mode: 'signedOut' });
      })
      .withFailureHandler(function () {
        // Even if the server call fails, still drop the local session so the
        // person isn't stuck signed in on this device.
        resetAppForSignedOutState();
        resetAuthGate('You have been signed out.');
        el.authStatusText.classList.add('muted');
        renderAuthOptions({ mode: 'signedOut' });
      })
      .signOut(tokenToClear);
  }

  // Opens Google's account chooser straight away (GIS token client with
  // prompt=select_account). The picked account is verified server-side by
  // authenticateWithAccessToken(), which starts a fresh session for it; the
  // old session is ended. If the token client isn't available (no OAuth
  // client ID configured, or the GIS script failed to load), fall back to
  // the sign-in screen with the Google button.
  function handleSwitchAccount() {
    toggleProfileMenu(false);

    if (window.google && window.google.accounts && window.google.accounts.id) {
      try { google.accounts.id.disableAutoSelect(); } catch (e) {}
    }

    const clientId = el.authCard.dataset.clientId;
    const hasTokenClient = !!(clientId && window.google && google.accounts && google.accounts.oauth2);
    if (!hasTokenClient) {
      google.script.run
        .withSuccessHandler(finishSwitchAccount)
        .withFailureHandler(finishSwitchAccount)
        .signOut(state.sessionToken);
      return;
    }

    if (!state.oauthTokenClient) {
      state.oauthTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'openid email profile',
        callback: onSwitchAccountToken,
        error_callback: function (err) {
          // Popup closed or blocked: stay signed in as the current account.
          const blocked = err && err.type === 'popup_failed_to_open';
          showToast(blocked ? 'error' : 'info', blocked
            ? 'Popup was blocked. Allow popups for this site to switch accounts.'
            : 'Account switch cancelled.');
        }
      });
    }
    state.oauthTokenClient.requestAccessToken({ prompt: 'select_account' });
  }

  function onSwitchAccountToken(response) {
    if (!response || response.error || !response.access_token) {
      showToast('error', 'Account switch failed. Please try again.');
      return;
    }
    const previousToken = state.sessionToken;
    revokeOAuthAccessToken();
    state.oauthAccessToken = response.access_token;

    resetAppForSignedOutState();
    resetAuthGate('Switching account…');
    if (previousToken) google.script.run.withFailureHandler(function () {}).signOut(previousToken);

    google.script.run
      .withSuccessHandler(onAuthResolved)
      .withFailureHandler(function (err) { onAuthResolved({ authorized: false, reason: err.message || String(err) }); })
      .authenticateWithAccessToken(response.access_token);
  }

  function finishSwitchAccount() {
    resetAppForSignedOutState();
    resetAuthGate('Choose an account to continue.');
    el.authStatusText.classList.add('muted');
    renderAuthOptions({ mode: 'signedOut' });
  }

  function initials(name) { return (name || '?').trim().split(/\s+/).slice(0, 2).map(function (p) { return p[0]; }).join('').toUpperCase(); }

  function promptInstallIfAvailable() {
    const promptEvent = window.__deferredInstallPrompt;
    if (!promptEvent) { showToast('info', 'App is already installed or install isn\'t available yet.'); return; }
    promptEvent.prompt();
    promptEvent.userChoice.finally(function () { window.__deferredInstallPrompt = null; });

  // ==========================================================================
  // TOASTS
  // ==========================================================================
  function showToast(type, message) {
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.innerHTML = '<span class="toast-icon">' + toastIconSvg(type) + '</span><span class="toast-msg">' + escapeHtml(message) + '</span>';
    el.toastContainer.appendChild(toast);
    requestAnimationFrame(function () { requestAnimationFrame(function () { toast.classList.add('toast-in'); }); });
    setTimeout(function () {
      toast.classList.remove('toast-in');
      toast.classList.add('toast-out');
      setTimeout(function () { toast.remove(); }, 220);
    }, 3200);
  }

  function toastIconSvg(type) {
    if (type === 'success') return checkIconSvg();
    if (type === 'error') return xIconSvg();
    return infoIconSvg();
  }

  // ==========================================================================
  // SMALL DATA HELPERS
  // ==========================================================================
  function displayAppSource(source) {
    const s = (source || '').toString().trim().toUpperCase();
    if (XC_LABEL_APP_SOURCES.indexOf(s) !== -1) return 'XC';
    return source || 'General';
  }

   function canAttachFile(r) {
    return (r.AppSource || '').toString().trim().toUpperCase() === 'XCLB';
  }
  function moduleLabelFor(appSource) {
    const key = (appSource || '').toString().trim().toUpperCase();
    return MODULE_LABELS[key] || (appSource || 'General');
  }
  function categoryClass(label) { return CATEGORY_CLASS_MAP[(label || '').toString().toUpperCase()] || 'cat-default'; }

  function statusSlug(status) { return (status || 'pending').toString().trim().toLowerCase().replace(/\s+/g, '-'); }
  function statusPillHtml(status, extraClass) {
    const s = status || 'Pending';
    const slug = statusSlug(s);
    const known = ['pending', 'approved', 'rejected', 'for-verification'];
    const cls = known.indexOf(slug) !== -1 ? ('status-' + slug) : 'status-default';
    return '<span class="status-pill ' + cls + (extraClass ? (' ' + extraClass) : '') + '">' + escapeHtml(s) + '</span>';
  }

  // function kvRow(label, value) { return '<div class="kv-row"><div class="kv-key">' + escapeHtml(label) + '</div><div class="kv-val">' + escapeHtml(value || '—') + '</div></div>'; }
